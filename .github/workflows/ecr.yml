name: Clean Crystal Source Files Onlykyahahahahahha

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  clean-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete .cr and other unnecessary backend files
        run: |
          # .cr, .sh, .md, .yaml のいずれかにマッチするファイルを削除
          find . -type f \( -name '*.cr' -o -name '*.sh' -o -name '*.md' -o -name '*.yaml' \) -delete
          
          # (オプション) もしshard.ymlやshard.lockなど、Crystalの設定ファイルも消したい場合は以下を有効にしてください
          find . -type f \( -name 'shard.yml' -o -name 'shard.lock' \) -delete
          
          # 2. ファイルが消えたことで空になったディレクトリがあれば削除
          find . -type d -empty ! -path './.git*' -delete


      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          git add -A
          
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove .cr source files and keep frontend assets"
            git push origin HEAD:${{ github.ref }}
          else
            echo "No .cr files found to delete."
          fi
