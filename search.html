    <script>
        // 1. ブラウザのURLから検索クエリ（q と page）を取得
const urlParams = new URLSearchParams(window.location.search);
const queryText = urlParams.get('q') || '';
const currentPage = urlParams.get('page') || '1';

// 2. タイトルの動的変更
function updatePageTitle(q) {
    const titleElement = document.getElementById("page-title");
    if (!q) {
        titleElement.textContent = "Search - Invidious";
        return;
    }
    let displayTitle = q;
    if (q.length > 30) {
        displayTitle = q.substring(0, 30).replace(/\.+\$/, '').trimEnd() + "…";
    }
    titleElement.textContent = `${displayTitle} - Invidious`;
}

// 3. scriptタグを自動セットして読み込み、終わったら描画する関数
function loadApiScriptAndRender(q, page) {
    const noResultsBox = document.getElementById("no-results-box");
    const itemsContainer = document.getElementById("items-container");
    const redirectLink = document.getElementById("redirect-url-link");

    if (!q) {
        noResultsBox.style.display = "block";
        itemsContainer.style.display = "none";
        return;
    }

    // 動的に script タグを生成
    const script = document.createElement('script');
    script.src = `./api.js?q=${encodeURIComponent(q)}&page=${page}`;
    
    // スクリプトの読み込み（＝データの取得と格納）が完了した時の処理
    script.onload = () => {
        // api.js 側で window.videoData に格納したデータを取得
        const items = window.videoData;

        if (!items || items.length === 0) {
            noResultsBox.style.display = "block";
            itemsContainer.style.display = "none";
            redirectLink.href = `./search-data?q=${encodeURIComponent(q)}`;
        } else {
            noResultsBox.style.display = "none";
            itemsContainer.style.display = "flex";
            itemsContainer.innerHTML = ""; // 初期化

            // 取得した動画データをループで回してHTMLカードを生成
            items.forEach(video => {
                const videoCard = document.createElement("div");
                videoCard.className = "pure-u-1 pure-u-md-1-4 video-card"; 
                videoCard.innerHTML = `
                    <div class="thumbnail-container">
                        <a href="./watch?v=${video.videoId}">
                            <img src="${video.videoThumbnails?.[0]?.url || './img/no_thumb.png'}" alt="${video.title}" style="width:100%;">
                        </a>
                    </div>
                    <div class="video-info">
                        <p class="video-title">
                            <a href="./watch?v=${video.videoId}">${video.title}</a>
                        </p>
                        <p class="video-author">
                            <a href="./channel/${video.authorId}">${video.author}</a>
                        </p>
                        <p class="video-meta">${video.publishedText || ''} • 視聴回数: ${video.viewCount || 0}</p>
                    </div>
                `;
                itemsContainer.appendChild(videoCard);
            });
        }

        // 用が済んだ script タグは HTML から削除
        script.remove();
        // グローバル変数も綺麗に掃除しておく
        delete window.videoData;
    };

    script.onerror = () => {
        console.error("APIスクリプトの読み込みに失敗しました");
        noResultsBox.style.display = "block";
        itemsContainer.style.display = "none";
        script.remove();
    };

    document.body.appendChild(script);
}

// 4. 初期実行
document.addEventListener("DOMContentLoaded", () => {
    updatePageTitle(queryText);
    loadApiScriptAndRender(queryText, currentPage); // ここでスクリプト呼出と描画をセットで行う
});

    </script>
</body>
